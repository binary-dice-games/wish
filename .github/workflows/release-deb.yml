name: Build and publish .deb

# Builds a Debian/Ubuntu package (see cmake/Packaging.cmake's "runtime"
# COMPONENT and scripts/package_deb.py) and attaches it to the GitHub
# Release that triggered the run. Only produces a Linux amd64 .deb --
# dpkg-shlibdeps and ldconfig postinst/postrm generation are Debian-tooling
# specific, so this intentionally doesn't attempt MSYS2/Windows here (see
# scripts/package_release.py / docs/building.md for the cross-platform
# release zip instead).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build build-essential dpkg-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libgles2-mesa-dev

      - name: Derive package version from release tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          python3 scripts/package_deb.py --version "${{ steps.version.outputs.version }}"

      - name: Upload .deb to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.deb --clobber
