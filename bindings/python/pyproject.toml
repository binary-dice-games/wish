[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "wish-abi"
version = "1.0.0"
description = "Python bindings for the wish remote-UI framework, over the wish_client_dll / wish_server_dll C ABIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Binary Dice Games" }]
keywords = ["wish", "ui", "rmi", "ctypes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["bison-abi>=1.0.0"]

[project.urls]
Homepage = "https://github.com/binary-dice-games/wish"
Repository = "https://github.com/binary-dice-games/wish"
Documentation = "https://github.com/binary-dice-games/wish/blob/main/docs/bindings.md"

[project.optional-dependencies]
test = ["pytest"]

# ─── scikit-build-core ──────────────────────────────────────────────────────
# This package (bindings/python/) doesn't hold the CMakeLists.txt it builds
# from -- that's the repo root two levels up, which also builds the wish-cli
# app, tests, modules, and other bindings. `cmake.source-dir` points there,
# and `build.targets` restricts the actual build to the two ABI shared
# libraries the ctypes wrappers in `wish/_native.py`/`wish/_server_native.py`
# load: `wish_client_dll` (connects to a server) and `wish_server_dll` (hosts
# one, with real SDL3/web rendering). See the `SKBUILD` branches in the root
# CMakeLists.txt for the install() rules that place both inside the `wish`
# package directory, and docs/bindings.md for end-to-end instructions.
#
# Unlike bison's own pip package, this one deliberately does NOT force
# WISH_ENABLE_IMGUI/SDL3/WEB off -- wish_server_dll's whole purpose is to
# expose real rendering (an SDL3 window, or the web/browser renderer), so
# `pip install` here needs whatever those already require to build normally
# (see docs/building.md); it is a heavier build than bison's.
[tool.scikit-build]
cmake.source-dir = "../.."
cmake.build-type = "Release"
build.targets = ["wish_client_dll", "wish_server_dll"]
# Restrict `cmake --install` to the `wish` COMPONENT (the SKBUILD install()
# rules in the root CMakeLists.txt) so vendored dependencies' own install()
# rules don't dump their untagged headers/static libs into the wheel.
install.components = ["wish"]
wheel.packages = ["wish"]
# No CPython C API used (both DLLs are plain ctypes-loaded shared libraries,
# not Python extension modules) -- one wheel per platform covers every
# CPython 3.x, instead of scikit-build-core's default of tagging the wheel
# to the interpreter it happened to be built with.
wheel.py-api = "py3"

# No sdist support, for the same reason as bison-abi: cmake.source-dir points
# outside this directory. `pip install`/`pip install -e` against a full git
# checkout (see docs/bindings.md) builds directly from the working tree.

[tool.scikit-build.cmake.define]
PACKAGE_TESTS = "OFF"
WISH_BUILD_TESTS = "OFF"
WISH_BUILD_SHARED = "ON"
WISH_BUILD_SERVER_SHARED = "ON"

# `pip install -e` uses scikit-build-core's default editable settings
# (mode="redirect", rebuild=false), same reasoning as bison-abi's own
# pyproject.toml: an in-source rebuild would litter the whole repository.
# wish/_native.py's/_server_native.py's _find_library() scan sys.path for
# the redirect mode's site-packages/wish/lib*.so to compensate.

# ─── cibuildwheel ──────────────────────────────────────────────────────────
# Produces the pre-built platform wheels published to PyPI, so end users get
# `pip install wish-abi` with no compiler, no CMake, and no submodule
# checkout -- pip only falls back to a source build when no wheel matches.
# `.github/workflows/release-pypi.yml` runs this on a `py-v*` tag.
#
# Because `cmake.source-dir = "../.."`, cibuildwheel must run from the repo
# root (with submodules already checked out) so the whole tree is in the
# build context:
#
#   git submodule update --init --recursive
#   pipx run cibuildwheel --output-dir wheelhouse bindings/python
#
# `wheel.py-api = "py3"` above means one wheel per platform serves every
# CPython 3.8+, so we build against a single interpreter rather than the
# full matrix.
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*_i686", "*-musllinux_*", "pp*"]
build-verbosity = 1
# Smoke-test the freshly repaired wheel in an isolated venv: both ABI libs
# must load and `bison-abi` must resolve as a normal dependency.
test-command = "python -c \"import wish, wish.client, wish.server\""

[tool.cibuildwheel.linux]
# The default manylinux2014 image ships devtoolset-10 (GCC 10), whose
# libstdc++ lacks `std::bit_cast` and other C++20 library features bison
# (a bundled dependency) uses.  manylinux_2_28 (AlmaLinux 8) provides
# gcc-toolset-12, which links the newer libstdc++/libgcc bits statically --
# the wheel still runs against the stock system runtime and gains no
# dependencies; it only raises the glibc floor to 2.28 (2018+).
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# manylinux images are minimal; SDL3 needs X11 / OpenGL / Wayland dev headers
# to compile its video backends. SDL3 links statically into wish_server_dll
# (root CMakeLists.txt forces BUILD_SHARED_LIBS=OFF) and dlopen's the X11/GL
# runtime libs lazily, so auditwheel does not vendor them -- a host that
# opens a real SDL3 window still needs those runtime libs installed, same as
# any SDL application; the client and the headless `console` renderer do not.
before-all = "dnf install -y libX11-devel libXext-devel libXrandr-devel libXi-devel libXcursor-devel libXfixes-devel mesa-libGL-devel wayland-devel libxkbcommon-devel"
# The wheel test runs in a fresh manylinux container without `before-all`;
# pull in the runtime X11/GL libs so `import wish.server` resolves (SDL3
# dlopen's them lazily, but keep them present for a faithful smoke test).
before-test = "dnf install -y libX11 libXext mesa-libGL libxkbcommon libwayland-client libwayland-cursor || true"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# Apple's libc++ marks all of `std::filesystem` unavailable below macOS
# 10.15 (the filesystem runtime first shipped in the platform dylib in
# 10.15).  wish -- and bundled bison -- use `std::filesystem::path` in
# public headers, and cibuildwheel's default deployment target for the
# x86_64 build is 10.13.  Bump it here; cibuildwheel auto-clamps the arm64
# build to 11.0, so this only affects the Intel wheel.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests"]
